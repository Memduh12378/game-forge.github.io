<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilgisayarım Bu Oyunu Kaldırır mı?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&amp;display=swap" rel="stylesheet">
</head>
<body>

    <h1>Bilgisayarım Bu Oyunu Kaldırır mı?</h1>

    <div class="box">

        <h2>Bilgisayarım</h2>

        <input type="number" id="ram" placeholder="RAM (GB)">
        <input type="number" id="gpu" placeholder="Ekran Kartı Puanı">

        <h2>Oyunun Gereksinimleri</h2>

        <input type="number" id="minRam" placeholder="Minimum RAM">
        <input type="number" id="minGpu" placeholder="Minimum GPU Puanı">

        <button onclick="kontrolEt()">
            Kontrol Et
        </button>

        <h2 id="sonuc"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
